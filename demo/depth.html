<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cove · Reading view comparison</title><link rel="icon" href="/cove-icon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#eef0f3;color:#273446;font:13px "Segoe UI",sans-serif}header{height:80px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 24px;background:#fff;border-bottom:1px solid #dce1e7}h1{font-size:16px;margin:0 0 4px;font-weight:600}p{margin:0;color:#687586;font-size:12px}.controls{display:flex;gap:16px;align-items:center}label{display:flex;gap:8px;align-items:center}select{padding:7px 10px;border:1px solid #d0d7e0;border-radius:7px;background:#fff;color:#273446}main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;height:calc(100dvh - 80px)}article{min-width:0;display:flex;flex-direction:column;border:1px solid #d7dee8;border-radius:12px;overflow:hidden;background:#fff}h2{font-size:12px;font-weight:600;padding:11px 16px;margin:0;border-bottom:1px solid #d7dee8}iframe{border:0;flex:1;width:100%;min-height:0}body[data-view=current] article[data-kind=depth],body[data-view=depth] article[data-kind=current]{display:none}body:not([data-view=compare]) main{grid-template-columns:1fr}@media(max-width:700px){header{height:116px;align-items:flex-start;flex-direction:column;gap:10px;padding:12px}main{height:calc(100dvh - 116px);gap:8px;padding:8px}.controls{gap:10px}h2{padding:10px}}
</style></head><body data-view="compare"><header><div><h1>Cove · Reading view depth</h1><p>The same conversation. A quieter backdrop and clearer email cards.</p></div><div class="controls"><label>View<select id="view" aria-label="Comparison view"><option value="compare">Side by side</option><option value="current">Current</option><option value="depth">More depth</option></select></label><label>Theme<select id="theme" aria-label="Comparison theme"></select></label></div></header><main><article data-kind="current"><h2>Current · reading view</h2><iframe title="Current reading view" src="/demo/priority.html?reader=1&embedded=1&depth=current&theme=moonlit-light"></iframe></article><article data-kind="depth"><h2>More depth · clearer message cards</h2><iframe title="More depth reading view" src="/demo/priority.html?reader=1&embedded=1&depth=depth&theme=moonlit-light"></iframe></article></main><script type="module">
const theme=document.querySelector('#theme');for(const t of ['moonlit','warm','cold'])for(const l of ['light','dark']){const o=document.createElement('option');o.value=t+'-'+l;o.textContent=t[0].toUpperCase()+t.slice(1)+' · '+l;theme.append(o)}theme.onchange=()=>document.querySelectorAll('iframe').forEach(f=>f.contentWindow.postMessage({type:'cove-preview-theme',theme:theme.value},location.origin));document.querySelector('#view').onchange=e=>document.body.dataset.view=e.target.value;
</script></body></html>
