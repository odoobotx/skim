name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/task-inbox]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run check

      - name: Inbox grouping tests
        run: npm test

      - name: Install headless test browser
        run: npx playwright install chromium

      - name: Inbox interaction tests (synthetic mail)
        run: npm run test:inbox-ui

      - name: Build frontend
        run: npm run build

      - name: Rustfmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Tests
        run: cargo test
        working-directory: src-tauri

      - name: Build offline email rendering helper
        run: cargo build --example render_email
        working-directory: src-tauri

      - name: Email rendering tests (synthetic mail)
        run: npm run test:rendering

      - name: Save offline rendering helper
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendering-tool
          path: src-tauri/target/debug/examples/render_email.exe
          if-no-files-found: ignore

      - name: Build Windows preview installer
        run: npm run tauri -- build --bundles nsis

      - name: Save Windows preview installer
        uses: actions/upload-artifact@v4
        with:
          name: skim-tasks-windows-preview
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
